<!DOCTYPE html>
<html>
<head>
    <title>Unit Converter - Temperature</title>
</head>
<body>
<h1>Unit Converter - Temperature</h1>

    <form action="temperature" method="post">
        <label>Enter the temperature to convert:</label><br>
        <input type="text" name="value"><br><br>

        <label>From:</label><br>
        <select name="from">
            <option value="Celsius">Celsius (C)</option>
            <option value="Fahrenheit">Fahrenheit (F)</option>
            <option value="Kelvin">Kelvin (K)</option>
        </select><br><br>

        <label>To:</label><br>
        <select name="to">
            <option value="Celsius">Celsius (C)</option>
            <option value="Fahrenheit">Fahrenheit (F)</option>
            <option value="Kelvin">Kelvin (K)</option>
        </select><br><br>

        <input type="submit" value="Convert">
    </form>

    <a href="weight.html">Go to Weight Converter</a><br>
    <a href="length.html">Go to Length Converter</a>
</body>
</html>
