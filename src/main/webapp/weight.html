<!DOCTYPE html>
<html>
<head>
    <title>Unit Converter - Weight</title>
</head>
<body>
    <h1>Unit Converter - Weight</h1>

    <form action="weight" method="post">
        <label>Enter the weight to convert:</label><br>
        <input type="text" name="value"><br><br>

        <label>From:</label><br>
        <select name="from">
            <option value="mg">Milligram</option>
            <option value="g">Gram</option>
            <option value="kg">Kilogram</option>
            <option value="oz">Ounce</option>
            <option value="lb">Pound</option>
        </select><br><br>

        <label>To:</label><br>
        <select name="to">
            <option value="mg">Milligram</option>
            <option value="g">Gram</option>
            <option value="kg">Kilogram</option>
            <option value="oz">Ounce</option>
            <option value="lb">Pound</option>
        </select><br><br>

        <input type="submit" value="Convert">
    </form>

    <a href="length.html">Go to Length Converter</a>
</body>
</html>
