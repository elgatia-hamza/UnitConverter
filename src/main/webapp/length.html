<!DOCTYPE html>
<html>
<head>
    <title>Unit Converter - Length</title>
</head>
<body>
    <h1>Unit Converter - Length</h1>

    <form action="length" method="post">
        <label>Enter the length to convert:</label><br>
        <input type="text" name="value"><br><br>

        <label>Unit to convert from:</label><br>
        <select name="from">
            <option value="mm">Millimeter</option>
            <option value="cm">Centimeter</option>
            <option value="m">Meter</option>
            <option value="km">Kilometer</option>
            <option value="in">Inch</option>
            <option value="ft">Foot</option>
            <option value="yd">Yard</option>
            <option value="mi">Mile</option>
        </select>

        <label>Unit to convert to:</label><br>
        <select name="to">
            <option value="mm">Millimeter</option>
            <option value="cm">Centimeter</option>
            <option value="m">Meter</option>
            <option value="km">Kilometer</option>
            <option value="in">Inch</option>
            <option value="ft">Foot</option>
            <option value="yd">Yard</option>
            <option value="mi">Mile</option>
        </select><br><br>

        <input type="submit" value="Convert">
    </form>

    <a href="weight.html">Go to Weight Converter</a>
</body>
</html>
